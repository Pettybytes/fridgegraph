extend schema @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key"])

type Query {
  coordinationJobs(childId: ID): [CoordinationJob!]!
  """
  The STORED paid-ride estimate for one candidate on one job, with the household cap that judges it.
  Parent/guardian of the job's child, or the server-verified demo guide, only. Returns null when the
  stored evaluation carries no paid-ride price (drivers and non-paid paths); a hidden or nonexistent
  job is refused with the same generic UNAUTHORIZED — never an empty answer that reveals existence.
  """
  pickupRideEstimate(jobId: ID!, candidateId: ID!): PickupRideEstimate
  attempts(jobId: ID): [Attempt!]!
  informationRequests(childId: ID): [InformationRequest!]!
  confirmations(childId: ID): [Confirmation!]!
  voiceNote(id: ID!): VoiceNote
}

type PickupRideEstimate {
  jobId: ID!
  candidateId: ID!
  estimatedRideCostUsd: Float
  costBasis: String
  distanceMiles: Float
  costCalculatedAt: String
  householdCapUsd: Float
  paidRidePath: Boolean!
}

type InviteBudgetReservation {
  allowed: Boolean!
  generationId: ID
  remainingUsd: Float!
}

enum InviteGenerationOutcome {
  SUCCEEDED
  FAILED
  UNCERTAIN
}

type Mutation {
  requestPickup(childId: ID!, asOf: String, window: String): CoordinationJob!
  acceptPickup(attemptId: ID!, available: Boolean!, declineReason: DeclineReason): CandidateEvaluation!
  approvePickup(jobId: ID!, version: Int!, decision: ApprovalDecision!, declineReason: String, acceptOverLimit: Boolean = false): CoordinationJob!
  reserveInviteBudget(childId: ID!, source: String!, promptHash: String!): InviteBudgetReservation!
  settleInviteBudget(generationId: ID!, status: InviteGenerationOutcome!, model: String, outputSha256: String, cached: Boolean!): Boolean!
}

type Child @key(fields: "id") {
  id: ID!
}

type Person @key(fields: "id") {
  id: ID!
}

enum CoordinationType {
  PICKUP
  INVITATION
  ONBOARDING
}

enum DeclineReason {
  BUSY
  NO_TRANSPORT
  OTHER
}

enum ApprovalDecision {
  APPROVED
  DECLINED
}

enum AcceptanceEntryPoint {
  WEBHOOK_CALLBACK
  CANDIDATE_JWT
}

enum ResponseKind {
  ACCEPTED
  DECLINED
}

type CoordinationJob {
  id: ID!
  idempotencyKey: String!
  type: CoordinationType!
  child: Child!
  status: String!
  version: Int!
  candidateEvaluations: [CandidateEvaluation!]!
  overLimitCandidate: Person
  confirmation: Confirmation
}

type CandidateEvaluation {
  id: ID
  candidate: Person!
  reasonCode: String
  available: Boolean
  declineReason: DeclineReason
  acceptedVia: AcceptanceEntryPoint
  estimatedRideCostUsd: Float
  costBasis: String
  distanceMiles: Float
  locationProvenance: String
  costCalculatedAt: String
  respondedAt: String
  responseKind: ResponseKind
  voiceNoteId: ID
}

type Attempt {
  id: ID!
  job: CoordinationJob!
  channel: String!
  at: String!
}

type InformationRequest {
  id: ID!
  job: CoordinationJob!
  question: String!
  status: String!
}

type Confirmation {
  id: ID!
  job: CoordinationJob!
  receivedAt: String!
  candidate: Person!
  approvedBy: Person!
  overLimitApproved: Boolean!
}

type TurnTiming {
  speaker: Person!
  startSec: Float!
  endSec: Float!
}

enum VoiceNoteStatus {
  PENDING
  READY
}

type VoiceNote {
  id: ID!
  responseId: ID!
  status: VoiceNoteStatus!
  speaker: Person!
  transcript: String
  proposedScript: String
  durationSeconds: Float
  turnTimings: [TurnTiming!]
  createdAt: String!
}

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

scalar federation__FieldSet

directive @key(fields: federation__FieldSet!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE

directive @federation__requires(fields: federation__FieldSet!) on FIELD_DEFINITION

directive @federation__provides(fields: federation__FieldSet!) on FIELD_DEFINITION

directive @federation__external on OBJECT | FIELD_DEFINITION

directive @federation__extends on OBJECT | INTERFACE

directive @federation__inaccessible on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @federation__shareable repeatable on OBJECT | FIELD_DEFINITION

directive @federation__override(from: String!, label: String) on FIELD_DEFINITION

directive @federation__tag(name: String!) repeatable on FIELD_DEFINITION | INTERFACE | OBJECT | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION | SCHEMA

directive @federation__composeDirective(name: String) repeatable on SCHEMA

directive @federation__interfaceObject on OBJECT

scalar federation__Scope

directive @federation__authenticated on FIELD_DEFINITION | OBJECT | INTERFACE | SCALAR | ENUM

directive @federation__requiresScopes(scopes: [[federation__Scope!]!]!) on FIELD_DEFINITION | OBJECT | INTERFACE | SCALAR | ENUM

scalar federation__Policy

directive @federation__policy(policies: [[federation__Policy!]!]!) on FIELD_DEFINITION | OBJECT | INTERFACE | SCALAR | ENUM

scalar federation__ContextFieldValue

directive @federation__context(name: String!) repeatable on INTERFACE | OBJECT | UNION

directive @federation__fromContext(field: federation__ContextFieldValue) on ARGUMENT_DEFINITION

directive @federation__cost(weight: Int!) on ARGUMENT_DEFINITION | ENUM | FIELD_DEFINITION | INPUT_FIELD_DEFINITION | OBJECT | SCALAR

directive @federation__listSize(assumedSize: Int, slicingArguments: [String!], sizedFields: [String!], requireOneSlicingArgument: Boolean = true) on FIELD_DEFINITION

type _Service {
  sdl: String
}

scalar _Any

union _Entity = Child

extend type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
}