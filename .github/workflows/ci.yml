name: CI

# Tier 1 (static): typecheck + offline secret scan. No network, no credentials, no secrets.
# Tier 2 (build): web build, only when web/ exists on the branch.
#
# This workflow never deploys, never merges and never touches a database.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Seed identity-map tests
        run: npm run test:seed

      - name: MCP config generation tests
        run: npm run test:mcp-config

      - name: Secret scan
        run: npm run check

      - name: Village tests
        run: npm run test:village

      - name: villageWorld contract
        run: npm run test:village-world

  web:
    name: web build
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect web workspace
        id: detect
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "web/ not present on this branch — skipping build."
          fi

      - name: Install web
        if: steps.detect.outputs.present == 'true'
        run: npm ci --prefix web

      - name: Build web
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run build
