name: CI

# Tier 1 (static): typecheck + offline secret scan. No network, no credentials, no secrets.
# Tier 2 (build): web build, only when web/ exists on the branch.
#
# This workflow never deploys, never merges and never touches a shared/live database.
# The reset proof uses a disposable Postgres service with no runtime credentials.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Seed identity-map tests
        run: npm run test:seed

      - name: All-family fictional history and fixture copy
        run: node --import tsx --test src/demo/pristineHistory.test.ts src/demo/calendarDensity.test.ts

      - name: Mission Control coverage failure reporting (offline)
        run: node --test ops/mc-analytics-coverage.test.mjs

      - name: MCP config generation tests
        run: npm run test:mcp-config

      - name: Secret scan
        run: npm run check

      # Compose-time inputs, checked offline: `schema/*.graphql` is generated from
      # `src/subgraphs/*.ts`. When the two drift, composition still exits 0 and only the
      # supergraph is wrong, so this must fail here instead.
      - name: Subgraph SDL in sync
        run: npm run schema:check

      - name: Village tests
        run: npm run test:village

      - name: Health operation coverage
        run: npm run test:health-coverage

      - name: Reset provenance contract
        run: npm run test:reset-provenance

      - name: MCP schema selection
        run: npm run test:mcp-schema

      - name: Demo route guards
        run: npm run test:demo-guards

      - name: Demo app origins
        run: npm run test:demo-origins

      - name: Client IP resolution
        run: node --import tsx --test src/demo/client-ip.test.ts

      - name: Reset admission (shared lock)
        run: node --import tsx --test src/demo/reset-admission.test.ts

      - name: Public reset status proxy allowlist
        run: node --test ops/demo-reset-proxy.test.mjs

      - name: Fast reset receipt and cleanup regressions
        run: node --import tsx --test src/demo/reset.test.ts src/demo/resetOperation.test.ts src/demo/family-reset-race.test.ts

      - name: Guide reads (myChildren)
        run: node --import tsx --test src/subgraphs/guide-my-children.test.ts

      - name: Launcher offline compose
        run: npm run test:launcher-compose

      - name: Launcher plan (dry run)
        run: npm run test:launcher-dryrun

      - name: Hosting artifact contract
        run: npm run test:hosting-artifact

      - name: villageWorld contract
        run: npm run test:village-world

  web:
    name: web build
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect web workspace
        id: detect
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "web/ not present on this branch — skipping build."
          fi

      - name: Install web
        if: steps.detect.outputs.present == 'true'
        run: npm ci --prefix web

      - name: Build web
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web run build

      - name: Mission Control exact-record drilldowns
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web test -- src/features/mission-control/pulse/pulse.test.tsx

      - name: Reset perspective and recovery regressions
        if: steps.detect.outputs.present == 'true'
        run: npm --prefix web test -- src/features/personas/resetDemo.test.tsx src/features/personas/demoReset.transport.test.ts

  reset-database:
    name: isolated reset transaction proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 56439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply migrations and prove atomic scoped restore on disposable Postgres
        run: node --import tsx ops/fast-reset-proof.ts
