# Local federation config for `rover supergraph compose`.
# The coordination subgraph IS published to GraphOS under fridgegraph@dev (the routing URL is a
# local host, so it is reachable only from this machine). Nothing here publishes by itself.
federation_version: =2.9.0
subgraphs:
  village:
    routing_url: http://127.0.0.1:4001/
