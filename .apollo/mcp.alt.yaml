# Apollo MCP Server config for the alt stack (ops/alt-stack.sh) — identical to mcp.local.yaml
# except it points at the alt router (4012) and listens on 5051, so it can run alongside the main
# MCP server (5050) without conflict. Identity still comes from the caller, never from this file.
endpoint: http://127.0.0.1:4012/
transport:
  type: streamable_http
  address: 127.0.0.1
  port: 5051
schema:
  source: local
  path: ./supergraph.graphql
operations:
  source: local
  paths:
    - ./ops/PickupCandidates.graphql
introspection:
  introspect:
    enabled: false
  execute:
    enabled: false
  search:
    enabled: false
  validate:
    enabled: false

# See mcp.local.yaml for the full rationale: explicit mode + zero mutation operation files today
# means zero mutation tools are exposed, regardless of this setting.
overrides:
  mutation_mode: explicit

forward_headers:
  - authorization
