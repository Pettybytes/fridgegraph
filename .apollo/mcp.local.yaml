# Apollo MCP Server config — identity comes from the caller, never from this file.
endpoint: http://127.0.0.1:4010/
transport:
  type: streamable_http
  address: 127.0.0.1
  port: 5050
schema:
  source: local
  path: ./supergraph.graphql
operations:
  source: local
  paths:
    - ./ops/PickupCandidates.graphql
    - ./ops/JobTimeline.graphql
    - ./ops/Attempts.graphql
    - ./ops/ChildEvents.graphql
    - ./ops/AdultAvailability.graphql
    - ./ops/EffectiveSchedule.graphql
    - ./ops/OrbitStatus.graphql
    - ./ops/CheckInStatus.graphql
    - ./ops/OrbitVocabulary.graphql
    - ./ops/CareFacts.graphql
    - ./ops/MyChildren.graphql
    - ./ops/ProposeSchoolDayReport.graphql
introspection:
  introspect:
    enabled: false
  execute:
    enabled: false
  search:
    enabled: false
  validate:
    enabled: false

# Mutations are exposed ONLY when a mutation exists as an explicit operation file.
# Verified against the installed binary (Apollo MCP Server v2.1.0): the key is
# `overrides.mutation_mode` and the accepted values are none | explicit | all. Measured on
# 2026-10-28 with one query file and one mutation file:
#   explicit -> tools = PickupCandidates, ApproveRelationship
#   none     -> tools = PickupCandidates          (load log: "Skipping mutation operation")
#   all      -> tools = PickupCandidates, ApproveRelationship
# A mutation that has no operation file (grantAccess, revokeGrant) is not exposed in any mode:
# calling it returns `-32602 Tool <name> not found`. Ad-hoc `execute` is separately disabled
# above, so there is no path to an arbitrary mutation.
#
# This is an EXPOSURE gate, NOT an authorization mechanism. Apollo is explicit that mutation_mode
# is a configuration gate, not per-invocation approval. Identity, action authorization, parent
# approval and idempotency are enforced downstream, by the subgraph resolvers and Postgres RLS,
# with the caller's own token. Adding a write operation here must not be treated as granting it.
#
# ProposeSchoolDayReport.graphql (TASK: Rosina school-report tool) is the FIRST mutation operation
# file actually exposed through this config — a deliberate, narrow exception, not a reversal. It
# only ever writes a draft row to school_report_proposals (migration 0071); it never writes
# school_reports. confirmSchoolDayReport, the mutation that files the real, parent-visible report,
# has NO operation file anywhere in this directory, so it is not exposed in any mutation_mode —
# Rosina's tool transport structurally cannot reach it, the same guarantee this file already
# documents for grantAccess/revokeGrant above.
overrides:
  mutation_mode: explicit

# NOTHING is pinned here any more. The previous `headers:` block hard-coded x-demo-user: p_mom for
# every request, which meant every MCP caller acted as one fixed person. The caller's own bearer
# token is forwarded instead and verified by the subgraphs.
#
# Apollo MCP Server logs a warning when forwarding Authorization — expected, documented in
# docs/apollo-notes.md. A request with no token now fails closed with UNAUTHENTICATED.
forward_headers:
  - authorization
