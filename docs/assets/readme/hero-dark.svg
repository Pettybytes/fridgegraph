<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
<title id="title">FridgeGraph — a little more village</title>
<desc id="desc">An animated illustration of a notice becoming Rosina's proposal, a parent confirmation, and a shared village record.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b25"/><stop offset="1" stop-color="#162c3b"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#66d3ff" stop-opacity=".55"/><stop offset="1" stop-color="#66d3ff" stop-opacity="0"/></radialGradient>
  <style>
    svg { font-family: Inter, Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .card { fill:#1c3443; stroke:#375366; stroke-width:1.4; }
    .ink { fill:#f5fbff; } .muted { fill:#b5cedc; } .blue { fill:#54caff; }
    .beam { fill:none; stroke:#54caff; stroke-width:3; stroke-linecap:round; stroke-dasharray:7 12; opacity:.45; }
    .beamflow { animation: flow 9s linear infinite; }
    .lift1 { animation: lift 9s ease-in-out infinite; }
    .lift2 { animation: lift 9s ease-in-out -2.25s infinite; }
    .lift3 { animation: lift 9s ease-in-out -4.5s infinite; }
    .lift4 { animation: lift 9s ease-in-out -6.75s infinite; }
    .pulse { transform-origin:1100px 304px; animation: pulse 3.6s ease-out infinite; }
    .spark { animation: blink 3.6s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset:-76; } }
    @keyframes lift { 0%,17%,100% { transform:translateY(0); } 6% { transform:translateY(-9px); } }
    @keyframes pulse { 0% { transform:scale(.77); opacity:.75; } 75%,100% { transform:scale(1.36); opacity:0; } }
    @keyframes blink { 0%,60%,100% { opacity:.48; } 77% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .beamflow,.lift1,.lift2,.lift3,.lift4,.pulse,.spark { animation:none; } }
  </style>
</defs>
<rect width="1280" height="590" rx="30" fill="url(#sky)"/>
<circle cx="1132" cy="28" r="300" fill="url(#glow)"/><circle cx="81" cy="460" r="278" fill="url(#glow)" opacity=".55"/>
<path d="M0 496C168 447 261 545 431 505s268-86 423-35 292-13 426-65v185H0Z" fill="#29465a" opacity=".43"/>
<g transform="translate(58 45)">
  <rect width="42" height="52" x="0" y="0" rx="8" fill="none" stroke="#54caff" stroke-width="3.2"/>
  <path d="M21 2v48M16 12v13M26 12v13" fill="none" stroke="#54caff" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M13 34c2-4 7-2 8 0 1-2 6-4 8 0 2 4-8 9-8 9s-10-5-8-9Z" fill="#54caff"/>
  <text x="58" y="34" class="ink" font-size="30" font-weight="800" letter-spacing="-1.3">FridgeGraph</text>
</g>
<rect x="1003" y="51" width="218" height="40" rx="20" fill="#1c3443" stroke="#375366"/>
<circle cx="1024" cy="71" r="5" fill="#42bfa4"/><text x="1039" y="77" class="ink" font-size="14" font-weight="650">A little more village.</text>
<text x="58" y="175" class="ink" font-size="62" font-weight="800" letter-spacing="-3.4">The care around a child,</text>
<text x="58" y="244" class="blue" font-size="62" font-weight="800" letter-spacing="-3.4">finally connected.</text>
<text x="61" y="286" class="muted" font-size="21">Rosina prepares. Parents decide. The whole village sees what changed.</text>

<path class="beam beamflow" d="M239 413H1050"/>
<g class="lift1">
  <rect class="card" x="55" y="337" width="251" height="150" rx="22"/>
  <rect x="75" y="358" width="85" height="28" rx="14" fill="#29465a"/><text x="89" y="377" class="blue" font-size="12" font-weight="800" letter-spacing=".5">01 · SIGNAL</text>
  <text x="76" y="421" class="ink" font-size="21" font-weight="750">The day changes</text>
  <text x="76" y="449" class="muted" font-size="15">School notice · 12:30 dismissal</text>
</g>
<g class="lift2">
  <rect class="card" x="358" y="337" width="251" height="150" rx="22"/>
  <rect x="378" y="358" width="99" height="28" rx="14" fill="#29465a"/><text x="392" y="377" class="blue" font-size="12" font-weight="800" letter-spacing=".5">02 · ROSINA</text>
  <text x="379" y="421" class="ink" font-size="21" font-weight="750">A plan takes shape</text>
  <text x="379" y="449" class="muted" font-size="15">Conflict found · pickup proposed</text>
</g>
<g class="lift3">
  <rect class="card" x="661" y="337" width="251" height="150" rx="22"/>
  <rect x="681" y="358" width="103" height="28" rx="14" fill="#29465a"/><text x="695" y="377" class="blue" font-size="12" font-weight="800" letter-spacing=".5">03 · PARENT</text>
  <text x="682" y="421" class="ink" font-size="21" font-weight="750">One clear decision</text>
  <text x="682" y="449" class="muted" font-size="15">Review · confirm · save</text>
</g>
<g class="lift4">
  <rect class="card" x="964" y="337" width="261" height="150" rx="22"/>
  <rect x="984" y="358" width="110" height="28" rx="14" fill="#29465a"/><text x="998" y="377" class="blue" font-size="12" font-weight="800" letter-spacing=".5">04 · VILLAGE</text>
  <text x="985" y="421" class="ink" font-size="21" font-weight="750">One shared record</text>
  <text x="985" y="449" class="muted" font-size="15">Today · Mission Control · Activity</text>
</g>
<circle class="pulse" cx="1100" cy="304" r="19" fill="none" stroke="#54caff" stroke-width="2"/>
<g class="spark"><circle cx="1100" cy="304" r="6" fill="#54caff"/></g>
<text x="61" y="548" class="muted" font-size="14" font-weight="600" letter-spacing=".6">BUILT FOR THE FAMILY YOU HAVE · POWERED BY APOLLO + META MUSE</text>
</svg>