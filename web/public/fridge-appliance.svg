<svg xmlns="http://www.w3.org/2000/svg" width="560" height="880" viewBox="0 0 560 880" fill="none">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5eaf5"/><stop offset="45%" stop-color="#eef2fa"/><stop offset="55%" stop-color="#e1e7f3"/><stop offset="100%" stop-color="#d2d9ec"/>
    </linearGradient>
  </defs>
  <!-- soft floor shadow -->
  <ellipse cx="290" cy="852" rx="210" ry="20" fill="#2a3566" opacity="0.10"/>
  <!-- body -->
  <rect x="70" y="24" width="430" height="820" rx="42" fill="url(#steel)" stroke="#c3cbe0" stroke-width="2"/>
  <!-- freezer / fridge divide -->
  <path d="M74 300h422" stroke="#c7cfe2" stroke-width="3"/>
  <!-- handles -->
  <rect x="104" y="70" width="12" height="150" rx="6" fill="#aeb8d2"/>
  <rect x="104" y="360" width="12" height="320" rx="6" fill="#aeb8d2"/>

  <!-- village ties: strings connecting people-magnets on the lower door -->
  <g stroke="#6b73c9" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M250 470 L350 430 M350 430 L420 500 M350 430 L330 560 M250 470 L210 580 M420 500 L300 600"/>
  </g>
  <g>
    <circle cx="350" cy="430" r="26" fill="#f4a65b"/><circle cx="350" cy="430" r="26" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="250" cy="470" r="20" fill="#7d8ae8"/><circle cx="250" cy="470" r="20" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="420" cy="500" r="20" fill="#58b79a"/><circle cx="420" cy="500" r="20" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="330" cy="560" r="18" fill="#c07be0"/><circle cx="330" cy="560" r="18" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="210" cy="580" r="17" fill="#e0677a"/><circle cx="210" cy="580" r="17" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="300" cy="600" r="16" fill="#e6a93f"/><circle cx="300" cy="600" r="16" fill="none" stroke="#fff" stroke-width="4"/>
  </g>

  <!-- a photo, pinned (freezer door) -->
  <g transform="rotate(-5 250 150)">
    <rect x="178" y="84" width="150" height="132" rx="8" fill="#fff" stroke="#d6ddee" stroke-width="2"/>
    <rect x="192" y="98" width="122" height="84" rx="4" fill="#cfe6f5"/>
    <circle cx="232" cy="148" r="17" fill="#f3c9a0"/><path d="M215 182a17 17 0 0134 0z" fill="#7d8ae8"/>
    <circle cx="274" cy="152" r="14" fill="#f3c9a0"/><path d="M260 182a14 14 0 0128 0z" fill="#e0677a"/>
    <circle cx="250" cy="80" r="6" fill="#58b79a"/>
  </g>

  <!-- sticky notes -->
  <g transform="rotate(6 410 170)">
    <rect x="356" y="110" width="110" height="104" rx="6" fill="#ffe08a"/>
    <circle cx="411" cy="108" r="6" fill="#e0677a"/>
    <path d="M372 146h78M372 166h78M372 186h50" stroke="#b9962f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="rotate(-4 170 730)">
    <rect x="112" y="672" width="116" height="104" rx="6" fill="#bfe3d3"/>
    <circle cx="170" cy="670" r="6" fill="#7d8ae8"/>
    <path d="M128 706h84M128 726h84M128 746h52" stroke="#3f7d68" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- a child's crayon drawing -->
  <g transform="rotate(4 380 720)">
    <rect x="300" y="650" width="160" height="128" rx="6" fill="#fff6ea" stroke="#e7d9c4" stroke-width="2"/>
    <circle cx="340" cy="690" r="15" fill="#ffd24d"/><path d="M340 705v22M340 727l-13 16M340 727l13 16" stroke="#e0677a" stroke-width="5" stroke-linecap="round"/>
    <path d="M374 752q34-54 68 0" stroke="#58b79a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="380" cy="648" r="6" fill="#c07be0"/>
  </g>
</svg>
