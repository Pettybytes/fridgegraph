# Main router: GraphOS-connected, router-level JWT on. Listens on 4010 (health 8090).
#
# Requires APOLLO_KEY and APOLLO_GRAPH_REF in the environment; the schema is fetched from GraphOS
# via uplink, and that same connection carries the licence that makes `authentication.router`
# available. Startup MUST be proven at runtime: `config validate` accepts this file even when
# unlicensed, and through `rover dev` the failure only appears as "Failed healthcheck".
#
# ROLLBACK: router.yaml + the offline startup command in docs/auth-plan.md. Tested.
supergraph:
  listen: 127.0.0.1:4010
  introspection: true

health_check:
  enabled: true
  listen: 127.0.0.1:8090

include_subgraph_errors:
  all: true

authentication:
  router:
    jwt:
      jwks:
        - url: "${env.SUPABASE_URL}/auth/v1/.well-known/jwks.json"
          issuers:
            - "${env.SUPABASE_URL}/auth/v1"
          audiences:
            - authenticated
          algorithms:
            - ES256
      header_name: Authorization
      header_value_prefix: Bearer
      on_error: Error

# Router-level validation does not stop the token from reaching subgraphs, which verify it again.
# A MISSING token is not stopped here at all (documented router behaviour), so subgraph
# verification is what covers that path.
headers:
  all:
    request:
      operations:
        - propagate:
            named: Authorization
