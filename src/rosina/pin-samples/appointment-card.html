<!doctype html>
<!-- FICTIONAL pin sample: appointment card with READABLE text in the actual rendered image/PDF. Pinning
     does NOT book it. Child "Nora". Rendered by ops/render-pin-samples.mjs. -->
<html lang="en"><head><meta charset="utf-8"/><title>Appointment Card</title><style>
  :root{color-scheme:light} html,body{margin:0;background:#eef1f4;display:flex;justify-content:center}
  .card{width:620px;margin:120px 0;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(31,58,95,.14);
        font-family:Arial,sans-serif;color:#1b1f24;overflow:hidden}
  .bar{background:#1f3a5f;color:#fff;padding:18px 28px;font-size:20px;font-weight:700}
  .body{padding:26px 28px;font-size:17px;line-height:1.7}
  .row{display:flex;gap:10px;margin:6px 0}.lbl{color:#55606e;min-width:92px}
  .fine{padding:0 28px 22px;font-size:12px;color:#7a8491}
</style></head><body>
  <div class="card">
    <div class="bar">Maplewood Pediatric Dental</div>
    <div class="body">
      <div class="row"><span class="lbl">Patient:</span> <strong>Nora Ellison</strong></div>
      <div class="row"><span class="lbl">Date:</span> <strong>Friday, November 20, 2026</strong></div>
      <div class="row"><span class="lbl">Time:</span> <strong>3:30 PM</strong></div>
      <div class="row"><span class="lbl">With:</span> Dr. Patel</div>
      <div class="row"><span class="lbl">Address:</span> 12 Birch Lane, Maplewood Village</div>
      <p>Please arrive 10 minutes early. Call to reschedule.</p>
    </div>
    <div class="fine">Fictional document for the FridgeGraph demo. Any names are invented.</div>
  </div>
</body></html>
