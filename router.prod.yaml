# router.prod.yaml — the public-origin router (Phase 1).
# Dev configs (router.yaml / router.graphos.yaml) are untouched. Values that must not be literal
# (JWKS URL, issuer) come from the environment; the CORS origin is the ONE public origin, literal.

supergraph:
  listen: 127.0.0.1:4010
  introspection: false

health_check:
  enabled: true
  listen: 127.0.0.1:8090

# Router v2.18: keep messages and private extensions redacted. Orbit callers need
# the coordination error code to distinguish a missing audience from a null result.
include_subgraph_errors:
  all:
    redact_message: true
    allow_extensions_keys: []
  subgraphs:
    coordination:
      redact_message: true
      allow_extensions_keys: [code]

sandbox:
  enabled: false

homepage:
  enabled: false

cors:
  policies:
    - origins: ["https://fridgegraph.loomz.stream"]
  allow_credentials: true
  allow_headers: [authorization, content-type]
  methods: [GET, POST, OPTIONS]

headers:
  all:
    request:
      operations:
        - propagate:
            named: Authorization
