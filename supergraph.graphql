type Mutation
  @join__type(graph: ACCESS)
  @join__type(graph: COORDINATION)
  @join__type(graph: VILLAGE)
{
  grantAccess(actorId: ID!, childId: ID!, scopes: [String!]!, validFrom: String, validUntil: String): Grant @join__field(graph: ACCESS)
  revokeGrant(id: ID!): Boolean! @join__field(graph: ACCESS)
  requestPickup(childId: ID!, asOf: String, window: String): CoordinationJob! @join__field(graph: COORDINATION)
  acceptPickup(attemptId: ID!, available: Boolean!, declineReason: DeclineReason): CandidateEvaluation! @join__field(graph: COORDINATION)
  approvePickup(jobId: ID!, version: Int!, decision: ApprovalDecision!, declineReason: String, acceptOverLimit: Boolean = false): CoordinationJob! @join__field(graph: COORDINATION)

  """
  Creates or updates a PENDING_ACTIVATION draft. Parent/guardian only; sends nothing.
  """
  orbitDraft(childId: ID!, wearColor: String, wearGarment: String, hair: String, carryColor: String, carryItem: String, photoId: ID): OrbitDraft! @join__field(graph: COORDINATION)

  """
  The exact notification the village would receive, plus the binding version and hash.
  """
  orbitPreview(draftId: ID!): OrbitPreview! @join__field(graph: COORDINATION)

  """
  The parent's explicit confirmation. Refuses a stale version, a changed preview or a changed audience.
  """
  orbitActivate(draftId: ID!, draftVersion: Int!, messageHash: String!): OrbitAlert! @join__field(graph: COORDINATION)

  """
  A frozen audience member responds. Appends history; never closes the alert.
  """
  orbitRespond(alertId: ID!, response: String!): OrbitResponseResult! @join__field(graph: COORDINATION)

  """Parent/guardian only. No response closes the alert by itself."""
  orbitClose(alertId: ID!): OrbitAlert! @join__field(graph: COORDINATION)

  """
  DEV SHORTCUT: skips invite + contact verification. Real lifecycle comes later.
  """
  approveRelationship(relationshipId: ID!): Relationship @join__field(graph: VILLAGE)
}

