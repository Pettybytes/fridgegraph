type Query
  @join__type(graph: ACCESS)
  @join__type(graph: ACTIVITIES)
  @join__type(graph: COORDINATION)
  @join__type(graph: SCHEDULE)
  @join__type(graph: SCHOOL)
  @join__type(graph: TRANSPORT)
  @join__type(graph: VILLAGE)
{
  grants(childId: ID, actorId: ID): [Grant!]! @join__field(graph: ACCESS)
  approvals(subjectId: ID): [Approval!]! @join__field(graph: ACCESS)
  householdPolicy(householdId: ID!): [HouseholdPolicy!]! @join__field(graph: ACCESS)
  parentingSchedule(childId: ID!): [ParentingSchedule!]! @join__field(graph: ACCESS)
  pickupCandidates(childId: ID!, asOf: String): [Candidate!]! @join__field(graph: ACCESS)
  supervisionCandidates(childId: ID!, asOf: String): [Candidate!]! @join__field(graph: ACCESS)
  approverFor(childId: ID!, date: String): ApproverResult! @join__field(graph: ACCESS)
  practices(childId: ID!, date: String!): [Practice!]! @join__field(graph: ACTIVITIES)
  groupEvents(groupId: ID!): [GroupEvent!]! @join__field(graph: ACTIVITIES)
  coordinationJobs(childId: ID): [CoordinationJob!]! @join__field(graph: COORDINATION)
  attempts(jobId: ID): [Attempt!]! @join__field(graph: COORDINATION)
  informationRequests(childId: ID): [InformationRequest!]! @join__field(graph: COORDINATION)
  confirmations(childId: ID): [Confirmation!]! @join__field(graph: COORDINATION)

  """
  The recorded lifecycle of one job, oldest first. Additive (E3).
  
  Every entry is derived from a stored timestamp — there is no synthesized or presented time. A job
  the caller cannot see returns an empty list rather than an error, so the response never tells a
  stranger that a job id exists.
  """
  jobTimeline(jobId: ID!): [TimelineEntry!]! @join__field(graph: COORDINATION)

  """
  One Orbit alert. A caller who may not see it receives null — identical to a nonexistent id, so
  the read is not an existence oracle.
  """
  orbitAlert(alertId: ID!): OrbitAlert @join__field(graph: COORDINATION)

  """
  Orbit state for a child. A parent/guardian sees the full view; an audience member sees only their
  own row; everyone else sees an empty status, never an error that would reveal the alert.
  """
  orbitStatus(childId: ID!, alertId: ID): OrbitStatus! @join__field(graph: COORDINATION)

  """
  The expected-check-in signal, parent view only: reports "check-in not recorded" — never
  "missing", never "in danger". Carries the 911 guidance text.
  """
  checkInStatus(childId: ID!): CheckInStatus! @join__field(graph: COORDINATION)

  """
  The controlled descriptor vocabulary — the closed list every Orbit share value must come from.
  Public and versioned: an authenticated read, no oracle concern.
  """
  orbitVocabulary(version: Int): [OrbitVocabularyEntry!]! @join__field(graph: COORDINATION)

  """
  Care facts for a child, each with its source and its verification. RLS decides visibility:
  parent/guardian, a caregiver holding careplan.read, or the guide on sandbox rows.
  """
  careFacts(childId: ID!): [CareFact!]! @join__field(graph: COORDINATION)
  events(childId: ID!, date: String!): [Event!]! @join__field(graph: SCHEDULE)

  """
  A child's calendar across a date range (YYYY-MM-DD, both ends inclusive). Cancelled entries are
  hidden unless includeCancelled is true; proposed and confirmed are returned with their status.
  """
  childEvents(childId: ID!, from: String!, to: String!, includeCancelled: Boolean = false): [CalendarEvent!]! @join__field(graph: SCHEDULE)

  """
  Recorded Busy/Free windows for a person.
  
  FREE means RECORDED FREE TIME. It is NOT confirmation of willingness, permission, or suitability
  to care for a child, and it never means the person can pick a child up. Never read it that way to
  a parent: say "has free time recorded", not "is available to watch" or "can pick up".
  """
  adultAvailability(personId: ID!, from: String!, to: String!): [AvailabilityWindow!]! @join__field(graph: SCHEDULE)

  """
  Who has the child on a date and which rule produced it: an APPROVED holiday arrangement first
  (its interval is inclusive at both ends), otherwise the weekly schedule.
  """
  effectiveScheduleFor(childId: ID!, date: String!): EffectiveSchedule! @join__field(graph: SCHEDULE)

  """
  Overlaps and gaps in parenting coverage for a window. Surfaced, never resolved silently.
  """
  scheduleConflicts(childId: ID!, from: String!, to: String!): [ScheduleConflict!]! @join__field(graph: SCHEDULE)
  schoolReports(childId: ID!): [SchoolReport!]! @join__field(graph: SCHOOL)
  permissionSlips(childId: ID!): [PermissionSlip!]! @join__field(graph: SCHOOL)
  busRoster(childId: ID!, date: String!): BusRoster @join__field(graph: TRANSPORT)
  vehicles(personId: ID!): [Vehicle!]! @join__field(graph: TRANSPORT)
  person(id: ID!): Person @join__field(graph: VILLAGE)
  child(id: ID!): Child @join__field(graph: VILLAGE)
  village(id: ID!): Village @join__field(graph: VILLAGE)
  households(childId: ID!): [Household!]! @join__field(graph: VILLAGE)
  householdMembers(childId: ID!): [HouseholdMember!]! @join__field(graph: VILLAGE)
  relationships(childId: ID!): [Relationship!]! @join__field(graph: VILLAGE)
  contactMethods(personId: ID!, childId: ID): [ContactMethod!]! @join__field(graph: VILLAGE)
  capabilities(personId: ID): [Capability!]! @join__field(graph: VILLAGE)
  groups: [Group!]! @join__field(graph: VILLAGE)
  memberships(groupId: ID): [Membership!]! @join__field(graph: VILLAGE)
  goals(childId: ID!): [Goal!]! @join__field(graph: VILLAGE)
  carePlan(childId: ID!): CarePlan @join__field(graph: VILLAGE)
}

